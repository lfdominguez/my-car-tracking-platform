<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <!-- Theme boot: must run before any CSS paints, so it's inline and the very
       first thing in <head>. Sets [data-theme] on <html> (design-system/
       theme-switcher/) before the WASM app hydrates, avoiding a flash of the
       wrong theme. Precedence: localStorage > prefers-color-scheme > dark
       (this product's default mode). -->
  <script>
    (function () {
      var DARK_COLOR = "#08090d", LIGHT_COLOR = "#f5f6fa";
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? LIGHT_COLOR : DARK_COLOR);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#08090d"/>
  <meta name="color-scheme" content="dark light"/>
  <!-- The app ships its own token-driven dark and light themes (design-system/
       tokens). Dark Reader re-darkens an already-dark palette, which flattens the
       accent ramp and the elevation ladder to gray; this lock tells it to stand
       down and let the product theme through. -->
  <meta name="darkreader-lock"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Car Tracking"/>
  <meta name="application-name" content="Car Tracking"/>
  <meta name="description" content="Trip tracking, telemetry, and route insights"/>
  <title>Car Tracking</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/icons/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <!-- Design-system tokens (crates/web/design-system/tokens/tokens.css): no url()
       references, safe for Trunk's CSS pipeline. Must load before style.css,
       which consumes these custom properties. -->
  <link data-trunk rel="css" href="design-system/tokens/tokens.css"/>
  <link data-trunk rel="css" href="style.css"/>
  <link data-trunk rel="rust" data-wasm-opt="z"/>
  <!-- Vendor assets (self-hosted for CSP script-src 'self'). -->
  <link data-trunk rel="copy-file" href="public/qrcode.min.js"/>
  <link data-trunk rel="copy-file" href="public/sw.js"/>
  <link data-trunk rel="copy-file" href="public/pwa-register.js"/>
  <link data-trunk rel="copy-file" href="public/fonts.css"/>
  <link data-trunk rel="copy-file" href="public/manifest.webmanifest"/>
  <link data-trunk rel="copy-dir" href="public/icons" data-target-path="icons"/>
  <link data-trunk rel="copy-dir" href="public/vendor" data-target-path="vendor"/>
  <!-- fonts.css is a plain (non-Trunk-processed) stylesheet like the vendor CSS
       below — its url() references need to survive untouched. -->
  <link rel="stylesheet" href="/fonts.css"/>
  <link rel="stylesheet" type="text/css" href="/vendor/phosphor-duotone.css"/>
  <link rel="stylesheet" type="text/css" href="/vendor/phosphor-regular.css"/>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css"/>
  <script src="/vendor/maplibre-gl.js"></script>
  <script src="/vendor/echarts.min.js"></script>
  <!-- Absolute path: relative src breaks on client routes like /cars/:id (SPA deep links). -->
  <script src="/qrcode.min.js"></script>
  <script src="/pwa-register.js"></script>
</head>
<body></body>
</html>
