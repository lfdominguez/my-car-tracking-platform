name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      # Covers crates/web too: rustfmt does not need the crate to compile.
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # crates/web is WASM-only, so it is linted for wasm32 below instead of
      # natively, matching the split in tests.yml.
      - name: Run clippy
        run: |
          for crate in shared vault_crypto ai server; do
            echo "::group::clippy -p $crate"
            cargo clippy -p "$crate" --all-targets -- -D warnings
            echo "::endgroup::"
          done

      - name: Run clippy on the web crate (wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p web --target wasm32-unknown-unknown -- -D warnings
