[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/web",
    "crates/shared",
    "crates/ai",
    "crates/vault_crypto",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
shared = { path = "crates/shared" }
ai = { path = "crates/ai" }
vault_crypto = { path = "crates/vault_crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
tracing = "0.1"
